name: jakmyeongbyeol
description: 사주와 전통 성명학 기반 아기 이름 작명 앱 '작명별'
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  google_mobile_ads: ^9.2.0
  app_links: ^7.2.2
  share_plus: ^13.3.1
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

# 앱 아이콘 생성 설정: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app-icon-1024.png"
  adaptive_icon_background: "assets/icon/icon-background.png"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# 스플래시 생성 설정: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0C1226"
  image: "assets/icon/splash-star.png"
  android_12:
    color: "#0C1226"
    icon_background_color: "#0C1226"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app-icon-1024.png
    - assets/icon/splash-star.png
